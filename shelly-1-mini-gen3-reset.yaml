---
# Reset-only variant of the shared Shelly 1 Mini Gen3 base: an always-on relay
# where "off" only ever means a momentary power cycle of the load. The relay
# powers up at every boot and every normal off comes back on after a fixed 10s.
# A thermal-cutoff off is left to the base, which restores the relay once the
# board cools.
#
# Use it for any load that must stay powered and only be rebooted, not
# switched off.
packages:
  base: !include shelly-1-mini-gen3.yaml

esphome:
  name: shelly-1-mini-gen3-reset
  friendly_name: Shelly 1 Mini Gen3 Reset-Only

switch:
  # Extend the relay defined in the base package rather than redefining it.
  - id: !extend relay
    restore_mode: ALWAYS_ON
    on_turn_off:
      - if:
          condition:
            lambda: 'return !id(thermal_tripped);'
          then:
            - delay: 10s
            - switch.turn_on: relay
