external_components:
  - source:
      type: local
      path: components

esphome:
  name: shelly-plus-1
  friendly_name: Shelly Plus 1
  name_add_mac_suffix: true
  platformio_options:
    board_build.f_cpu: 160000000L

substitutions:
  # Higher value gives lower watt readout
  current_res: "0.001"
  # Lower value gives lower voltage readout
  voltage_div: "1925"

web_server:
  local: true
  auth:
    username: !secret web_server_username
    password: !secret web_server_password

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_ESP32_DEFAULT_CPU_FREQ_160: y
      CONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ: "160"

wifi:
  ap:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Not none: with the radio always on, these sealed boards idle close to the
  # thermal cutoff.
  power_save_mode: light
  min_auth_mode: WPA2

captive_portal:

globals:
  - id: thermal_tripped
    type: bool
    initial_value: 'false'

logger:

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago

api:
  reboot_timeout: 0s
#  encryption:
#    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

switch:
  - platform: gpio
    id: relay
    name: Relay
    pin: GPIO26
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - globals.set:
          id: thermal_tripped
          value: 'false'

binary_sensor:
  - platform: gpio
    name: Switch
    pin: GPIO4
    on_press:
      then:
        - switch.toggle: relay
    filters:
      - delayed_on_off: 50ms
  - platform: gpio
    name: Button
    pin:
      number: GPIO25
      inverted: yes
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - switch.toggle: relay
    filters:
      - delayed_on_off: 5ms

sensor:
  - platform: ntc
    sensor: temp_resistance_reading
    name: Temperature
    unit_of_measurement: °C
    accuracy_decimals: 1
    icon: mdi:thermometer
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    # Matches Shelly stock firmware's 95C cutoff. Only an off caused by this
    # cutoff is undone on cooling; a user's off is left alone.
    on_value_range:
      - above: 95.0
        then:
          - if:
              condition:
                switch.is_on: relay
              then:
                # Flag before turning off so on_turn_off handlers can see why.
                - globals.set:
                    id: thermal_tripped
                    value: 'true'
                - switch.turn_off: relay
      - below: 85.0
        then:
          - if:
              condition:
                lambda: 'return id(thermal_tripped);'
              then:
                - switch.turn_on: relay
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - platform: adc
    id: temp_analog_reading
    pin: GPIO32
    attenuation: 12db
  - platform: adc
    name: Relay Supply Voltage
    pin: GPIO33
    attenuation: 12db
    filters:
      - multiply: 8
  - platform: shelly_dht
    pin_a: GPIO1
    pin_b: GPIO0
    temperature:
      name: Add On Temperature
    humidity:
      name: Add On Humidity
    update_interval: 60s

