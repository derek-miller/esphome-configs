---
# ratgdo32 v3.2 (ESP32), dry-contact wiring. Dry-contact logic comes from
# upstream base_drycontact.yaml via packages; conventions follow
# gianos-ratgdo-v25i.yaml. One file, many units — name_add_mac_suffix gives each
# board a ratgdo32-<mac> hostname; list each unit's IP in devices.conf.

substitutions:
  id_prefix: ratgdo32
  friendly_name: "ratgdo32"
  uart_tx_pin: GPIO17
  uart_rx_pin: GPIO21
  input_obst_pin: GPIO4
  dry_contact_open_pin: GPIO13   # TC harness pad -> open-limit reed
  dry_contact_close_pin: GPIO14  # TO harness pad -> close-limit reed
  discrete_open_pin: GPIO26      # SD harness pad; unused (single-button install)
  discrete_close_pin: GPIO25     # SO harness pad; unused
  dht_data_pin: GPIO32           # soldered to the ESP32 module pad, not a harness pad

esphome:
  name: ${id_prefix}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.4.0
  project:
    name: ratgdo.v32board_drycontact
    version: "32.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

dashboard_import:
  package_import_url: github://ratgdo/esphome-ratgdo/v32board_drycontact.yaml@main

packages:
  remote_package:
    url: https://github.com/ratgdo/esphome-ratgdo
    files: [base_drycontact.yaml]
    refresh: 1s
  # remote_package: !include
  #   file: base_drycontact.yaml

web_server:
  version: 3
  local: true
  auth:
    username: !secret web_server_username
    password: !secret web_server_password

switch:
  - platform: ratgdo
    id: ${id_prefix}_led
    type: led
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    name: "LED"
    entity_category: config

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s

  # DHT22 breakout: DATA to the ESP32 module pad, VCC/GND to 3.3V and ground on
  # the board. No aux-harness pad works — TC/TO/TL sit behind ~7.7k series
  # resistors, SD/SO are transistor outputs. pullup: false, the breakout has its
  # own 4.7k.
  - platform: dht
    pin:
      number: ${dht_data_pin}
      mode:
        input: true
        pullup: false
    model: DHT22
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    update_interval: 60s

api:
  reboot_timeout: 0s
  id: api_server
  encryption:
    key: !secret api_encryption_key

improv_serial:

esp32_improv:
  authorizer: none

wifi:
  ap:
    ssid: "ratgdo"
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

captive_portal:

logger:

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago